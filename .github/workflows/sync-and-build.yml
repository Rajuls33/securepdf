name: Upstream Mirror & Zerofye Release Build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-Forward Mirror from Upstream
        run: |
          git config user.name "Zerofye Bot"
          git config user.email "bot@zerofye.dev"
          git remote add upstream https://github.com/storytold/pdfcraft.git || true
          git fetch upstream main
          git checkout upstream/main -- .
          # Remove upstream workflows so GITHUB_TOKEN doesn't reject workflow file updates
          rm -rf .github/workflows/ci.yml .github/workflows/test.yml 2>/dev/null || true
          git checkout HEAD -- zerofye-overlay .github/workflows/sync-and-build.yml
          git add -A
          git commit -m "chore: sync upstream pdfcraft" || echo "Already up to date"
          git push origin main

      - name: Extract Release Version
        id: ver
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "tag=v$V" >> $GITHUB_OUTPUT

  build-release:
    needs: sync-upstream
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: pdfcraft.exe
            out_name: securepdf-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: pdfcraft
            out_name: securepdf-linux-x64
          
