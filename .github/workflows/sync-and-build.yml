name: Upstream Mirror & Zerofye Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: pdfcraft
            out_name: securepdf-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: pdfcraft.exe
            out_name: securepdf-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Apply Zerofye Overlay (Build-Time Only)
        shell: pwsh
        run: |
          if (Test-Path "zerofye-overlay/apply.js") {
            node zerofye-overlay/apply.js
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Setup WiX v5 (Windows MSI Installer)
        if: matrix.os == 'windows-latest'
        run: dotnet tool install --global wix --version 5.0.0

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Windows MSI Installer & Portable Zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path "packaging/windows/package.ps1") {
            & packaging/windows/package.ps1
          }

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.21.1
          files: |
            target/${{ matrix.target }}/release/${{ matrix.bin_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
